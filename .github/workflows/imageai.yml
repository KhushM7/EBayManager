# Builds the photo AI container (imageai/, docs/imageai.md) and publishes it to GitHub Container Registry,
# tagged with the commit (sha-xxxxxxx) and latest. Infra pins the sha tag. The package must be public once
# (GitHub -> Packages -> ebaymanager-imageai -> Package settings -> Change visibility) so Azure can pull it
# without a registry password: it holds only open models and app.py, no secrets.
name: imageai

on:
  push:
    branches: [main]
    paths: ["imageai/**", ".github/workflows/imageai.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: imageai
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ebaymanager-imageai" >> "$GITHUB_OUTPUT"
          echo "sha=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: imageai
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: |
          echo "Published ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Deploy with: \$env:IMAGEAI_IMAGE='${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}'; node scripts/azure-infra.mjs sandbox" >> "$GITHUB_STEP_SUMMARY"

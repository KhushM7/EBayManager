name = "ebay-autopilot"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# Top level = local development only (`npx wrangler dev`): eBay Sandbox, local D1 and R2.
# Deploy with `npm run deploy:sandbox` or `npm run deploy:production`, never a bare `wrangler deploy`.
# See docs/safety-and-environments.md.

[vars]
EBAY_ENV = "sandbox"
WRITE_MODE = "approval"
# EBAY_GB = UK site.
EBAY_MARKETPLACE = "EBAY_GB"
EBAY_SITE_ID = "3"
PUBLIC_URL = "http://localhost:8787"

[[d1_databases]]
binding = "DB"
database_name = "ebay-autopilot-local"
database_id = "local"

# Dashboard and PWA, built by `npm run build:web`. The Worker runs first and serves these for unknown paths.
[assets]
directory = "web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# R2 photo storage (binding PHOTOS) is added in Phase 8; R2 isn't enabled on the account yet.

[triggers]
crons = ["0 2 * * *"]

# --- eBay Sandbox: fake listings, approved writes (Phases 1-5) ---
[env.sandbox]
name = "ebay-autopilot-sandbox"

[env.sandbox.vars]
EBAY_ENV = "sandbox"
WRITE_MODE = "approval"
EBAY_MARKETPLACE = "EBAY_GB"
EBAY_SITE_ID = "3"
PUBLIC_URL = "https://ebay-autopilot-sandbox.ebay-autopilot.workers.dev"

[env.sandbox.assets]
directory = "web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[env.sandbox.d1_databases]]
binding = "DB"
database_name = "ebay-autopilot-sandbox"
database_id = "94aa60bf-c500-476c-9d4b-70df3fbfd31a"

# --- Production: K's real account. WRITE_MODE stays "off" (read-only) until the go-live checklist in Phase 7. ---
[env.production]
name = "ebay-autopilot-production"

[env.production.vars]
EBAY_ENV = "production"
WRITE_MODE = "off"
EBAY_MARKETPLACE = "EBAY_GB"
EBAY_SITE_ID = "3"
PUBLIC_URL = "https://ebay-autopilot-production.<your-subdomain>.workers.dev"

[env.production.assets]
directory = "web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[env.production.d1_databases]]
binding = "DB"
database_name = "ebay-autopilot-production"
database_id = "<filled in by `npx wrangler d1 create ebay-autopilot-production` at Phase 6>"

# Secrets, per environment (`npx wrangler secret put NAME --env sandbox`), never committed:
#   EBAY_APP_ID, EBAY_CERT_ID, EBAY_DEV_ID, EBAY_RUNAME   that environment's eBay keyset
#   EBAY_COMPS_APP_ID, EBAY_COMPS_CERT_ID                 optional production keyset for Browse comps only
#   MCP_TOKEN      bearer token for /mcp and /oauth/start
#   DASHBOARD_KEY  K's dashboard sign-in key (never given to Claude's connector)
#   ANTHROPIC_API_KEY  K's Anthropic key for the listing review and nightly triage
#   VAPID_KEY      Web Push key pair, a P-256 private JWK (`node scripts/make-keys.mjs`)
#   SIGNING_KEY    HMAC key for approval links
#   NTFY_TOPIC     private ntfy topic for push notifications
# For `wrangler dev`, put the Sandbox values in .dev.vars (gitignored).
